<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HOMIRX - Let's Find Your Dream House</title>
 

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
 
<style>

    * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --dark-navy: #0b2138; --dark-navy-2: #0f2a45; --orange: #f9622c;
    --orange-hover: #e0501e; --text-light: #cfd8e3; --white: #ffffff; --card-radius: 14px;
  }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; color: #1c1c1c; }
  a { text-decoration: none; color: inherit; }
  button { cursor: pointer; font-family: inherit; border: none; }
  .icon-inline { margin-right: 6px; }
 

    .navbar { display: flex; align-items: center; justify-content: space-between; background: var(--dark-navy); padding: 18px 40px; color: var(--white); position: sticky; top: 0; z-index: 100; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 22px; }
  .logo span { color: var(--orange); }
  .logo small { display: block; font-size: 10px; font-weight: normal; color: var(--text-light); letter-spacing: 1px; }
  .nav-links { display: flex; gap: 28px; list-style: none; }
  .nav-links li a { font-size: 15px; color: var(--text-light); transition: color .2s; }
  .nav-links li a:hover { color: var(--orange); }
  .nav-right { display: flex; align-items: center; gap: 18px; }
  .icon-btn { background: rgba(255,255,255,.08); color: var(--white); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; position: relative; transition: background .2s; }
  .icon-btn:hover { background: rgba(255,255,255,.2); }
  .cart-count { position: absolute; top: -4px; right: -4px; background: var(--orange); color: white; font-size: 11px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .btn-add { background: var(--orange); color: white; padding: 10px 20px; border-radius: 30px; font-size: 14px; font-weight: 600; transition: background .2s; }
  .btn-add:hover { background: var(--orange-hover); }
  .burger { display: none; font-size: 24px; background: none; color: white; }
 

    .hero { position: relative; min-height: 620px; background: linear-gradient(180deg, rgba(11,33,56,.55), rgba(11,33,56,.75)), url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat; display: flex; align-items: center; padding: 40px; color: white; }
  .hero-inner { max-width: 900px; }
  .hero h1 { font-size: 48px; line-height: 1.2; margin-bottom: 24px; }
  .hero h1 .accent { color: var(--orange); }
  .search-box { background: rgba(10,25,45,.85); border-radius: var(--card-radius); padding: 20px; max-width: 780px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { background: transparent; color: var(--text-light); padding: 8px 18px; border-radius: 6px; font-size: 14px; }
  .tab.active { background: var(--orange); color: white; }
  .search-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .search-field { flex: 1; min-width: 140px; background: rgba(255,255,255,.06); border-radius: 8px; padding: 8px 12px; }
  .search-field label { display: block; font-size: 11px; color: var(--text-light); margin-bottom: 2px; }
  .search-field input, .search-field select { width: 100%; background: transparent; border: none; color: white; font-size: 14px; outline: none; }
  .search-field select option { color: #111; }
  .search-btn { background: var(--orange); color: white; padding: 0 26px; border-radius: 8px; font-weight: 600; font-size: 14px; }
  .search-btn:hover { background: var(--orange-hover); }
  .quick-links { display: flex; gap: 14px; margin-top: 20px; flex-wrap: wrap; }
  .pill { background: rgba(255,255,255,.12); padding: 8px 18px; border-radius: 30px; font-size: 13px; color: white; transition: background .2s; }
  .pill:hover { background: var(--orange); }
 

    .section { padding: 70px 40px; }
  .section.dark { background: var(--dark-navy); color: white; }
  .eyebrow { color: var(--orange); font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .section-title { font-size: 32px; font-weight: 700; margin-bottom: 40px; }
  .section-title.center, .eyebrow.center { text-align: center; }
    
 
  .category-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
  .category-card { border: 1px solid rgba(255,255,255,.2); border-radius: var(--card-radius); padding: 30px 16px; text-align: center; background: rgba(255,255,255,.02); transition: transform .2s, background .2s, border-color .2s; }
  .category-card:hover, .category-card.active { background: var(--orange); border-color: var(--orange); transform: translateY(-6px); }
  .category-icon { display: block; font-size: 34px; margin-bottom: 14px; }
  .category-card h3 { font-size: 16px; margin-bottom: 4px; }
  .category-card p { font-size: 13px; color: var(--text-light); }
  .category-card:hover p, .category-card.active p { color: white; }
 
  .listing-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; flex-wrap: wrap; gap: 16px; }
  .filter-tabs { display: flex; gap: 10px; }
  .filter-tabs button { background: #eef1f5; color: #333; padding: 8px 16px; border-radius: 20px; font-size: 13px; }
  .filter-tabs button.active { background: var(--orange); color: white; }
 
  .property-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }

  .property-card { background: white; border-radius: var(--card-radius); overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,.06); transition: transform .25s, box-shadow .25s; }
  .property-card:hover { transform: translateY(-8px); box-shadow: 0 14px 30px rgba(0,0,0,.12); }
  .property-img-wrap { position: relative; height: 210px; }
  .property-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .fav-btn { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,.85); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #999; transition: color .2s; }
  .fav-btn.active { color: var(--orange); }
  .badge { position: absolute; top: 12px; left: 12px; background: var(--orange); color: white; font-size: 11px; padding: 4px 10px; border-radius: 20px; }
  .property-body { padding: 18px 20px; }
  .rating { color: #f5a623; font-size: 13px; margin-bottom: 6px; }
  .rating span { color: #888; margin-left: 4px; }
  .property-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .property-location { font-size: 13px; color: #888; margin-bottom: 10px; }
  .property-desc { font-size: 13px; color: #777; margin-bottom: 14px; line-height: 1.5; }
  .property-stats { display: flex; gap: 16px; font-size: 12px; color: #555; margin-bottom: 14px; flex-wrap: wrap; }
  .property-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; padding-top: 14px; }
  .price { color: var(--orange); font-weight: 700; font-size: 16px; }
  .btn-details { background: var(--dark-navy); color: white; padding: 9px 18px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; gap: 6px; transition: background .2s; }
  .btn-details:hover { background: var(--orange); }
  .load-more-wrap { text-align: center; margin-top: 40px; }
  .btn-outline { background: transparent; border: 2px solid var(--dark-navy); padding: 10px 26px; border-radius: 30px; font-weight: 600; font-size: 14px; transition: all .2s; }
  .btn-outline:hover { background: var(--dark-navy); color: white; }
 
  .location-collage { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; height: 340px; }
  .location-collage img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
  .collage-main { position: relative; border-radius: 10px; overflow: hidden; }
  .collage-main img { width: 100%; height: 100%; object-fit: cover; }
  .collage-caption { position: absolute; bottom: 20px; left: 20px; color: white; }
  .collage-caption h3 { font-size: 26px; }
  .collage-caption p { font-size: 13px; opacity: .8; }
  .collage-caption .count { background: var(--orange); display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 8px; }
 
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
  .modal { background: white; border-radius: var(--card-radius); max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; animation: pop .2s ease; }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-img { height: 260px; width: 100%; object-fit: cover; }
  .modal-body { padding: 24px; }
  .modal-close { float: right; background: #f1f1f1; width: 32px; height: 32px; border-radius: 50%; }
  .modal-stats { display: flex; gap: 20px; margin: 16px 0; flex-wrap: wrap; }
  .modal-stats div { font-size: 13px; color: #555; }
  .modal-stats b { display: block; font-size: 16px; color: #111; }
  .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; }
  .btn-cart { background: var(--dark-navy); color: white; }
  .btn-cart:hover { background: var(--orange); }
  .btn-fav-modal { background: #f1f1f1; color: #333; }
 
  .cart-drawer { position: fixed; top: 0; right: 0; width: 360px; max-width: 90vw; height: 100%; background: white; box-shadow: -8px 0 30px rgba(0,0,0,.2); z-index: 1000; padding: 24px; overflow-y: auto; animation: slideIn .25s ease; }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .cart-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eee; }
  .cart-item img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; }
  .cart-item-info { flex: 1; }
  .cart-item-info h4 { font-size: 14px; }
  .cart-item-info span { font-size: 12px; color: #888; }
  .remove-btn { background: none; color: #cc3333; font-size: 12px; }
  .empty-msg { text-align: center; color: #999; padding: 40px 0; font-size: 14px; }
 

    .trust-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; text-align: center; }
  .trust-card { background: white; border-radius: var(--card-radius); padding: 30px 16px; box-shadow: 0 6px 20px rgba(0,0,0,.05); }
  .trust-card .icon { display: block; font-size: 30px; margin-bottom: 12px; }
  .trust-card h4 { font-size: 15px; margin-bottom: 6px; }
  .trust-card p { font-size: 12px; color: #888; }
 

    footer { background: var(--dark-navy); color: var(--text-light); text-align: center; padding: 30px; font-size: 13px; }
  footer span { color: var(--orange); }
 

    @media (max-width: 900px) {
    .category-grid { grid-template-columns: repeat(3, 1fr); }
    .trust-grid { grid-template-columns: repeat(2, 1fr); }
    .location-collage { grid-template-columns: 1fr 1fr; height: auto; }
    .collage-main { grid-column: span 2; height: 220px; }
  }
  @media (max-width: 700px) {
    .nav-links { display: none; }
    .burger { display: block; }
    .hero h1 { font-size: 32px; }
    .search-row { flex-direction: column; }
    .category-grid { grid-template-columns: repeat(2, 1fr); }
    .section { padding: 50px 20px; }
    .trust-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
 
<div id="root"></div>
 
<script type="text/babel">
const { useState } = React;
 

const PROPERTIES = [

  },
  {

  },
  {

    price: 410,
    rating: 4.3,
    reviews: 18,
    sqft: 1800,

    baths: 3,
    img: "https://images.unsplash.com/photo-1613490493576-7fde63acd811?q=80&w=900&auto=format&fit=crop",
    desc: "Hotel-style tower with a city view and 24/7 security."
  },
  {
    id: 4,
    title: "Golden Gate Warehouse",
    location: "8 Industrial Ave, New Jersey",
    category: "Warehouse",
    price: 890,
    rating: 4.5,

    desc: "Large warehouse space with a loading ramp and high ceilings."
  },
  {
    id: 5,
    title: "Sunrise Commercial Tower",
    location: "5th Avenue, New York",
    category: "Commercial",
    price: 1200,
    rating: 4.7,
    reviews: 30,
    sqft: 3400,
    beds: 0,
    baths: 4,
    img: "https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=900&auto=format&fit=crop",
    desc: "Office building with an open-plan layout and conference rooms."
  },
  {
    id: 6,
    title: "Lakeview Homestay",
    location: "Lake Road, Vermont",
    category: "Homestay",
    price: 150,
    rating: 4.9,
    reviews: 55,
    sqft: 900,
    beds: 2,
    baths: 1,
    img: "https://images.unsplash.com/photo-1499793983690-e29da59ef1c2?q=80&w=900&auto=format&fit=crop",
    desc: "Cozy house by the lake, perfect for a getaway."
  },
  {
    id: 7,
    title: "Emerald Villa Estate",
    location: "Palm Hills, California",
    category: "Villa",
    price: 980,
    rating: 4.6,
    reviews: 27,
    sqft: 4200,
    beds: 6,
    baths: 5,
    img: "https://images.unsplash.com/photo-1613977257363-707ba9348227?q=80&w=900&auto=format&fit=crop",
    desc: "Luxury villa with a private pool, garden, and panoramic views."
  },
  {
    id: 8,
    title: "Downtown Boutique Store",
    location: "Main Street, Chicago",
    category: "Commercial",
    price: 670,
    rating: 4.2,
    reviews: 9,
    sqft: 1200,
    beds: 0,
    baths: 1,
    img: "https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=900&auto=format&fit=crop",
    desc: "Retail space on a central street, with large display windows."
  },
];
 
const CATEGORIES = [
  { name: "Commercial", icon: "fa-building" },
  { name: "Warehouse", icon: "fa-warehouse" },
  { name: "Villa", icon: "fa-house-chimney" },
  { name: "Apartment", icon: "fa-city" },
  { name: "Homestay", icon: "fa-house" },
];
 
function Navbar({ cartCount, onCartClick }) {
  return (
    <nav className="navbar">
      <div className="logo">
        <i className="fas fa-house icon-inline"></i>HOM<span>IRX</span>
        <small>LIVING SOLUTIONS</small>
      </div>
      <ul className="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#properties">Properties</a></li>
        <li><a href="#agents">Agents</a></li>
        <li><a href="#pages">Pages</a></li>
        <li><a href="#news">News</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <div className="nav-right">
        <button className="icon-btn" onClick={onCartClick} title="Cart">
          <i className="fas fa-cart-shopping"></i>
          {cartCount > 0 && <span className="cart-count">{cartCount}</span>}
        </button>
        <button className="btn-add">+ Add Properties</button>
        <button className="burger"><i className="fas fa-bars"></i></button>
      </div>
    </nav>
  );
}
 

function Hero({ filters, setFilters, onSearch }) {
  const [tab, setTab] = useState("General");
  const tabs = ["General", "Villa", "Apartment"];
 
  return (
    <header className="hero" id="home">
      <div className="hero-inner">
        <h1>Let's Find Your <br /><span className="accent">Dream House.</span></h1>
 
        <div className="search-box">
          <div className="tabs">
            {tabs.map(t => (
              <button
                key={t}
                className={"tab " + (tab === t ? "active" : "")}
                onClick={() => setTab(t)}
              >{t}</button>
            ))}
          </div>
 
          <div className="search-row">
            <div className="search-field">
              <label>Keyword</label>
              <input
                type="text"
                placeholder="Looking For?"
                value={filters.keyword}
                onChange={e => setFilters({ ...filters, keyword: e.target.value })}
              />
            </div>
 
            <div className="search-field">
              <label>Category</label>
              <select
                value={filters.category}
                onChange={e => setFilters({ ...filters, category: e.target.value })}
              >
                <option value="">Select Category</option>
                {CATEGORIES.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
              </select>
            </div>
 
            <div className="search-field">
              <label>Location</label>
              <input
                type="text"
                placeholder="Location"
                value={filters.location}
                onChange={e => setFilters({ ...filters, location: e.target.value })}
              />
            </div>
 
            <button className="search-btn" onClick={onSearch}><i className="fas fa-magnifying-glass icon-inline"></i>Search</button>
          </div>
 
          <div className="quick-links">
            <a className="pill" href="#properties" onClick={() => setFilters({ ...filters, category: "Commercial" })}>Commercial →</a>
            <a className="pill" href="#properties" onClick={() => setFilters({ ...filters, category: "Villa" })}>Villa →</a>
            <a className="pill" href="#properties" onClick={() => setFilters({ ...filters, category: "" })}>Sales →</a>
          </div>
        </div>
      </div>
    </header>
  );
}

function Categories({ activeCategory, setActiveCategory }) {
  return (
    <section className="section dark">
      <p className="eyebrow center">Property By Requirement</p>
      <h2 className="section-title center">Explore Apartment Types</h2>
      <div className="category-grid">
        {CATEGORIES.map(cat => {
          const count = PROPERTIES.filter(p => p.category === cat.name).length;
          const isActive = activeCategory === cat.name;
          return (
            <div
              key={cat.name}
              className={"category-card " + (isActive ? "active" : "")}
              onClick={() => setActiveCategory(isActive ? "" : cat.name)}
            >
              <i className={"category-icon fas " + cat.icon}></i>
              <h3>{cat.name}</h3>
              <p>{count} Properties</p>
            </div>
          );
        })}
      </div>
    </section>
  );
}

function StarRating({ rating }) {
  const stars = [];
  for (let i = 1; i <= 5; i++) {
    const filled = i <= Math.round(rating);
    stars.push(<i key={i} className={(filled ? "fas" : "far") + " fa-star"}></i>);
  }
  return <React.Fragment>{stars}</React.Fragment>;
}
 

function PropertyCard({ property, isFav, toggleFav, openDetails }) {
  return (
    <div className="property-card">
      <div className="property-img-wrap">
        <img src={property.img} alt={property.title} />
        <span className="badge">{property.category}</span>
        <button
          className={"fav-btn " + (isFav ? "active" : "")}
          onClick={() => toggleFav(property.id)}
          title="Add to favorites"
        ><i className={isFav ? "fas fa-heart" : "far fa-heart"}></i></button>
      </div>
      <div className="property-body">
        <div className="rating">
          <StarRating rating={property.rating} />
          <span>{property.rating} ({property.reviews})</span>
        </div>
        <div className="property-title">{property.title}</div>
        <div className="property-location"><i className="fas fa-location-dot icon-inline"></i>{property.location}</div>
        <p className="property-desc">{property.desc}</p>
        <div className="property-stats">
          <span><i className="fas fa-ruler-combined icon-inline"></i>{property.sqft} sqft</span>
          {property.beds > 0 && <span><i className="fas fa-bed icon-inline"></i>Bed {property.beds}</span>}
          <span><i className="fas fa-bath icon-inline"></i>Bath {property.baths}</span>
        </div>
        <div className="property-footer">
          <span className="price">${property.price}.00</span>
          <button className="btn-details" onClick={() => openDetails(property)}><i className="fas fa-circle-info icon-inline"></i>Details</button>
        </div>
      </div>
 
    </div>
  );
}
 

function DetailsModal({ property, onClose, isFav, toggleFav, addToCart }) {
  if (!property) return null;
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <img className="modal-img" src={property.img} alt={property.title} />
        <div className="modal-body">
          <button className="modal-close" onClick={onClose}><i className="fas fa-xmark"></i></button>
          <div className="rating">
            <StarRating rating={property.rating} />
            <span>{property.rating} ({property.reviews} reviews)</span>
          </div>
          <h2>{property.title}</h2>
          <p className="property-location"><i className="fas fa-location-dot icon-inline"></i>{property.location}</p>
          <p style={{margin: "14px 0", color: "#555", lineHeight: 1.6}}>{property.desc}</p>
 
          <div className="modal-stats">
            <div><b>{property.sqft}</b>Sqft</div>
            <div><b>{property.beds}</b>Bedrooms</div>
            <div><b>{property.baths}</b>Bathrooms</div>
            <div><b>${property.price}</b>Per Month</div>
          </div>
 
          <div className="modal-actions">
            <button className="btn-fav-modal" onClick={() => toggleFav(property.id)}>
              <i className={(isFav ? "fas" : "far") + " fa-heart icon-inline"}></i>
              {isFav ? "Remove Favorite" : "Add to Favorite"}
            </button>
            <button className="btn-cart" onClick={() => addToCart(property)}><i className="fas fa-cart-shopping icon-inline"></i>Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  );
}
 
   Side cart panel (Cart Drawer)
function CartDrawer({ items, onClose, removeItem }) {

    let total = 0;
  for (let i = 0; i < items.length; i++) {
    total = total + items[i].price;
  }
  return (
    <div className="overlay" onClick={onClose}>
      <div className="cart-drawer" onClick={e => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}><i className="fas fa-xmark"></i></button>
        <h2 style={{marginBottom: 20}}>My Cart ({items.length})</h2>
 
        {items.length === 0 && <p className="empty-msg"><i className="fas fa-cart-shopping icon-inline"></i>Your cart is empty</p>}
 
        {items.map(item => (
          <div className="cart-item" key={item.id}>
            <img src={item.img} alt={item.title} />
            <div className="cart-item-info">
              <h4>{item.title}</h4>
              <span>${item.price}.00 / month</span>
            </div>
            <button className="remove-btn" onClick={() => removeItem(item.id)}>Remove</button>
          </div>
        ))}
 
        {items.length > 0 && (
          <div style={{marginTop: 20, fontWeight: 700, fontSize: 16}}>
            Total: ${total}.00
          </div>
        )}
      </div>
    </div>
  );
}

    { icon: "fa-scroll", title: "Licensed Brokers", desc: "Only certified agents work with us" },

function App() {
  const [filters, setFilters] = useState({ keyword: "", category: "", location: "" });
  const [appliedFilters, setAppliedFilters] = useState({ keyword: "", category: "", location: "" });
  const [activeCategory, setActiveCategory] = useState("");
  const [favorites, setFavorites] = useState([]);
  const [cart, setCart] = useState([]);
  const [selectedProperty, setSelectedProperty] = useState(null);
  const [showCart, setShowCart] = useState(false);
  const [visibleCount, setVisibleCount] = useState(6);
 
  const toggleFav = (id) => {
    setFavorites(prev => prev.includes(id) ? prev.filter(f => f !== id) : [...prev, id]);
  };
 
  const addToCart = (property) => {
    setCart(prev => prev.some(p => p.id === property.id) ? prev : [...prev, property]);
    setSelectedProperty(null);
  };
 
  const removeFromCart = (id) => setCart(prev => prev.filter(p => p.id !== id));
 
  const handleSearch = () => {
    setAppliedFilters(filters);
    setActiveCategory(filters.category || "");
    document.getElementById("properties").scrollIntoView({ behavior: "smooth" });
  };
 
  const filteredProperties = PROPERTIES.filter(p => {
    const matchCategory = activeCategory ? p.category === activeCategory : true;
    const matchKeyword = appliedFilters.keyword
      ? p.title.toLowerCase().includes(appliedFilters.keyword.toLowerCase())
      : true;
    const matchLocation = appliedFilters.location
      ? p.location.toLowerCase().includes(appliedFilters.location.toLowerCase())
      : true;
    return matchCategory && matchKeyword && matchLocation;
  });
 
  return (
    <React.Fragment>
      <Navbar cartCount={cart.length} onCartClick={() => setShowCart(true)} />
      <Hero filters={filters} setFilters={setFilters} onSearch={handleSearch} />
      <Categories activeCategory={activeCategory} setActiveCategory={setActiveCategory} />
 
      <section className="section" id="properties">
        <div className="listing-header">
          <div>
            <p className="eyebrow">Our Listing</p>
            <h2 className="section-title" style={{marginBottom: 0}}>Find Home Listing in Your Area</h2>
          </div>
          <div className="filter-tabs">
            {["", "Apartment", "Villa", "Commercial"].map(cat => (
              <button
                key={cat || "all"}
                className={activeCategory === cat ? "active" : ""}
                onClick={() => setActiveCategory(cat)}
              >{cat || "All"}</button>
            ))}
          </div>
        </div>
 
        <div className="property-grid">
          {filteredProperties.slice(0, visibleCount).map(p => (
            <PropertyCard
              key={p.id}
              property={p}
              isFav={favorites.includes(p.id)}
              toggleFav={toggleFav}
              openDetails={setSelectedProperty}
            />
          ))}
        </div>
 
        {filteredProperties.length === 0 && (
          <p className="empty-msg"><i className="fas fa-magnifying-glass icon-inline"></i>No results found. Try a different search term.</p>
        )}
 
        {visibleCount < filteredProperties.length && (
          <div className="load-more-wrap">
            <button className="btn-outline" onClick={() => setVisibleCount(v => v + 6)}>Load More</button>
          </div>
        )}
      </section>
 
      <TopLocations />
      <TrustSection />
 
      <footer id="contact">
        <p>© 2026 <span>HOMIRX</span> Living Solutions. All rights reserved.</p>
      </footer>
 
      {selectedProperty && (
        <DetailsModal
          property={selectedProperty}
          onClose={() => setSelectedProperty(null)}
          isFav={favorites.includes(selectedProperty.id)}
          toggleFav={toggleFav}
          addToCart={addToCart}
        />
      )}
 
      {showCart && (
        <CartDrawer items={cart} onClose={() => setShowCart(false)} removeItem={removeFromCart} />
      )}
    </React.Fragment>
  );
}
 
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
    
</body>

</html>
